<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password | Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animation.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-art"><div>
      <a class="logo" href="index.html">
        <span class="logo-mark">
          <i class="fa-solid fa-layer-group">
          </i></span>Stackly</a>
          <h1>Reset access securely</h1>
          <p>Email verification, OTP confirmation, password reset, and success status are presented in one smooth flow.</p></div></section>
    <section class="auth-panel">
      <form class="form-card validate-form" data-success="Password reset flow completed.">
        <span class="eyebrow">Account Recovery</span>
        <h2>Forgot Password</h2><div class="form-group">
          <label>Email</label>
          <input required type="email" placeholder="you@company.com"></div>
          <div class="form-group"><label>OTP Code</label><input required type="text" placeholder="6 digit code" maxlength="6" pattern="[0-9]{6}" title="Enter exactly 6 digits"></div>
          <div class="form-grid"><div class="form-group">
            <label>New Password</label>
            <input name="password" required type="password" maxlength="8" oninput="this.form.confirmPassword.setCustomValidity(this.value === this.form.confirmPassword.value ? '' : 'Passwords do not match.')"></div>
            <div class="form-group"><label>Confirm Password</label>
              <input name="confirmPassword" required type="password" maxlength="8" oninput="this.setCustomValidity(this.value === this.form.password.value ? '' : 'Passwords do not match.')"></div></div>
              <button class="btn btn-primary" type="submit"><i class="fa-solid fa-circle-check">
               </i>Reset Password</button><p><a href="login.html">Back to login</a></p><a class="btn btn-ghost" href="index.html">Back to Home</a>
            </form>
          </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
