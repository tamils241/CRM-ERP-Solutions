<!DOCTYPE html>
<html lang="en">
    <head><meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>404 | Stackly</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/animation.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>
    <body class="loaded">
        <main>
            <section class="hero">
                <div class="container section-head fade-up">
                    <span class="eyebrow">404</span>
                    <h1>This page slipped out of the <span class="gradient-text">workflow</span></h1>
                    <p>The link may be outdated, but your route back to Stackly is ready.</p>
                    <div class="hero-actions" style="justify-content:center">
                        <button class="btn btn-light" type="button" id="backButton">
                            <i class="fa-solid fa-arrow-left"></i>Back
                        </button>
                        <a class="btn btn-primary" href="index.html">
                            <i class="fa-solid fa-house"></i>Back Home
                        </a>
                    </div>
                </div>
            </section>
        </main>
        <script src="js/animation.js"></script>
        <script>
            document.getElementById("backButton")?.addEventListener("click", () => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = "index.html";
                }
            });
        </script>
    </body>
</html>
