<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animation.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-art"><div class="fade-up"><a class="logo" href="index.html"><span class="logo-mark"><i class="fa-solid fa-layer-group"></i></span>Stackly</a><h1>Welcome back to your operating command center</h1><p>Review leads, invoices, projects, tasks, analytics, and notifications from one secure workspace.</p><div class="dashboard-preview"><div class="mini-card"><p>Today revenue</p><strong>$42.8K</strong></div><div class="mini-card"><p>Tasks due</p><strong>18</strong></div></div></div></section>
    <section class="auth-panel"><form class="form-card validate-form zoom-in" data-success="Login validated. Open the dashboard from the button below."><span class="eyebrow">Secure Login</span><h2>Sign in</h2><div class="form-group"><label>Email</label><input type="email" required placeholder="you@company.com"></div><div class="form-group"><label>Password</label><input type="password" required placeholder="Password"></div><div class="form-grid"><label><input type="checkbox"> Remember me</label><a href="forgot-password.html">Forgot password?</a></div><button class="btn btn-primary" type="submit">Login</button><div class="social-row"><button class="btn btn-light" type="button"><i class="fa-brands fa-google"></i>Google</button><button class="btn btn-light" type="button"><i class="fa-brands fa-microsoft"></i>Microsoft</button></div><p>New to Stackly? <a href="register.html"><strong>Create account</strong></a></p><a class="btn btn-ghost" href="user-dashboard.html">Open User Dashboard</a></form></section>
  </main><div class="toast"></div><script src="js/main.js"></script>
</body>
</html>
