<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animation.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-art"><div class="fade-up"><a class="logo" href="index.html"><span class="logo-mark"><i class="fa-solid fa-layer-group"></i></span>Stackly</a><h1>Start your CRM and ERP workspace</h1><p>Create an account for sales, operations, finance, support, and analytics teams.</p></div></section>
    <section class="auth-panel"><form class="form-card validate-form zoom-in" data-success="Account request submitted."><span class="eyebrow">Create Account</span><h2>Register</h2><div class="form-grid"><div class="form-group"><label>Full Name</label><input required type="text" maxlength="16" pattern="[A-Za-z ]+" title="Only letters and spaces, max 16 characters"></div><div class="form-group"><label>Company Name</label><input required type="text" pattern="[A-Za-z ]+" title="Only letters and spaces"></div></div><div class="form-grid"><div class="form-group"><label>Phone</label><input required type="tel" maxlength="10" pattern="[0-9]{10}" title="Enter exactly 10 digits"></div><div class="form-group"><label>Email</label><input required type="email"></div></div><div class="form-grid"><div class="form-group"><label>Password</label><input name="password" required type="password" maxlength="8" oninput="this.form.confirmPassword.setCustomValidity(this.value === this.form.confirmPassword.value ? '' : 'Passwords do not match.')"></div><div class="form-group"><label>Confirm Password</label><input name="confirmPassword" required type="password" maxlength="8" oninput="this.setCustomValidity(this.value === this.form.password.value ? '' : 'Passwords do not match.')"></div></div><div class="form-group"><label>Role</label><select required><option value="">Select role</option><option value="admin">Admin</option><option value="user">User</option></select></div><label><input type="checkbox" required> I agree to the terms and privacy policy</label><br><br><button class="btn btn-primary" type="submit">Create Account</button><p>Already registered? <a href="login.html"><strong>Login</strong></a></p><a class="btn btn-ghost" href="index.html">Back to Home</a></form></section>
  </main>

 <script src="js/main.js"></script>
</body>
</html>
